<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MUDST Jersey — Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&family=Chakra+Petch:ital,wght@0,500;0,600;0,700;1,600;1,700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#E3E5EB; --paper-2:#EEF0F4; --card:#F8F9FB; --ink:#1B1D21; --ink-2:#4A4E57; --steel:#6B7078;
  --line:#C8CBD3; --line-2:#D7DAE1;
  --a:#006C6C; --a2:#FFFFC9; --on-a:#FFFFFF; --a-soft:#D3E6E3;
  --ok:#1F7A4D; --warn:#A86A00; --bad:#B3261E; --info:#2F5E9E; --prod:#6B3FA0;
  --field:#FFFFFF; --side:#1B1D21; --on-ink:#FFFFFF; --shadow:rgba(20,24,30,.22);
  --ease:cubic-bezier(0.22,1,0.36,1); --t-fast:150ms; --t-mid:200ms; --t-slow:320ms;
  --r-sm:6px; --r:10px; --r-lg:18px;
  --disp:"Chakra Petch",system-ui,sans-serif; --body:"Anuphan",system-ui,sans-serif;
}

html[data-theme=dark]{
  --paper:#141415; --paper-2:#19191B; --card:#1D1D20; --field:#232325; --ink:#EDEDED; --ink-2:#A1A1A6; --steel:#85858B;
  --line:#36363C; --line-2:#2A2A2E; --side:#0F0F10; --on-ink:#141415; --shadow:rgba(0,0,0,.45);
  --ok:#4CC38A; --warn:#E0A23A; --bad:#E5484D; --info:#7FA6E0; --prod:#B48BE0;
  color-scheme:dark;
}
html[data-theme=dark] body.admin{--a:#5DBDB5;--on-a:#0B1716}
h1,h2,h3{font-weight:600}
.num,.price b,.kpi b,.meter .top b,.seglist .v,.sumrow span:last-child,.line-item strong,table.t td.num,.bars-h .v,.ticket .tp b{font-variant-numeric:tabular-nums}
.ic{display:block;flex:none}
.iconbtn{border:0;background:none;width:40px;height:40px;border-radius:8px;display:grid;place-items:center;color:var(--ink-2);transition:background-color var(--t-fast) var(--ease),color var(--t-fast) var(--ease)}
.iconbtn:hover{background:var(--paper-2);color:var(--ink)}
.themebtn{display:flex;align-items:center;gap:8px;margin-top:24px;border:1px solid #33363C;background:none;color:#C3C7CE;border-radius:8px;padding:8px 12px;font-size:14px;width:100%}
.themebtn:hover{background:#2A2D33;color:#fff}
.hh-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}
.hh-text .meter{margin-top:0}
.seglist{list-style:none;margin:0;padding:0}
.seglist li{display:grid;grid-template-columns:1fr auto 48px;gap:12px;padding:8px 0;border-bottom:1px solid var(--line-2);font-size:15px}
.seglist li:last-child{border-bottom:0}
.seglist .v{font-weight:600}
.seglist .p{text-align:right;color:var(--steel)}
.drop .ph.ok{background:var(--a);color:var(--on-a)}
.x{display:grid;place-items:center;color:var(--ink-2)}
.qty button,.mini-qty button{display:grid;place-items:center}
.mini-qty button{color:var(--ink)}
.dadmin.add b,.dcard.slot b{display:flex;justify-content:center}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--body);color:var(--ink);background:var(--paper);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;transition:background-color var(--t-slow) var(--ease),color var(--t-slow) var(--ease)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
img{max-width:100%;display:block}
a{color:inherit}
:focus-visible{outline:3px solid var(--a);outline-offset:2px;border-radius:4px}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* demo bar */
.demobar{background:var(--side);color:#E8E8E8;font-size:13px}
.demobar .wrap{display:flex;align-items:center;gap:12px;min-height:40px;flex-wrap:wrap}
.demobar .seg{display:inline-flex;background:#2E3136;border-radius:999px;padding:4px}
.demobar .seg button{border:0;background:none;color:#C9CCD3;padding:4px 12px;border-radius:999px;font-size:13px}
.demobar .seg button[aria-pressed=true]{background:#E8E8E8;color:#1B1D21;font-weight:600}
.demobar .dnote{color:#9EA3AC;margin-left:auto}

/* header */
header.site{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line-2)}
header.site .wrap{display:flex;align-items:center;gap:20px;height:64px}
.brand{display:flex;align-items:baseline;gap:8px;text-decoration:none;border:0;background:none;padding:0}
.brand b{font-family:var(--disp);font-style:italic;font-weight:700;font-size:26px;letter-spacing:-.5px;color:var(--a);line-height:1}
.brand span{font-family:var(--disp);font-weight:600;font-size:15px;color:var(--ink-2)}
nav.main{display:flex;gap:4px;margin-left:auto;align-items:center}
nav.main button{border:0;background:none;padding:8px 12px;border-radius:var(--r-sm);color:var(--ink-2);font-weight:500}
nav.main button:hover{background:var(--paper-2);color:var(--ink)}
nav.main button[aria-current=page]{color:var(--ink);box-shadow:inset 0 -2px 0 var(--a)}
.cartbtn{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--ink)!important;border-radius:8px!important;padding:8px 16px!important;color:var(--ink)!important}
.cartbtn .n{background:var(--a);color:var(--on-a);border-radius:999px;min-width:24px;height:24px;display:inline-grid;place-items:center;font-size:12px;font-weight:600;padding:0 8px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:var(--r);padding:12px 20px;font-weight:600;background:var(--a);color:var(--on-a);transition:transform var(--t-fast) var(--ease),filter var(--t-fast) var(--ease)}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.ghost:hover{box-shadow:inset 0 0 0 1.5px var(--ink)}
.btn.ink{background:var(--ink);color:var(--on-ink)}
.btn.small{padding:8px 12px;font-size:14px;border-radius:var(--r-sm)}
.btn.block{width:100%}
.btn.danger{background:transparent;color:var(--bad);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--bad) 45%,transparent)}
.link{border:0;background:none;padding:0;color:var(--a);font-weight:600;text-decoration:underline;text-underline-offset:3px}

/* hero / product */
.hero>*,.two>*,.co>*,.agrid>*,.adm>*{min-width:0}
.hero{display:grid;grid-template-columns:1.08fr 1fr;gap:40px;padding:36px 0 28px;align-items:start}
.stage{position:relative;aspect-ratio:1/1.02;display:grid;place-items:center;isolation:isolate;container-type:inline-size;overflow:hidden}
.stage .num{position:absolute;inset:0;display:grid;place-items:center;z-index:-1;font-family:var(--disp);font-weight:600;font-style:italic;font-size:78cqw;line-height:.8;letter-spacing:-.06em;padding-right:4cqw;color:transparent;-webkit-text-stroke:2px color-mix(in srgb,var(--a) 55%,transparent);user-select:none;}
.stage img.shirt{max-height:94%;width:auto;filter:drop-shadow(0 24px 32px var(--shadow));transition:opacity var(--t-mid) var(--ease)}
.stage .flip{position:absolute;left:0;bottom:4px;display:flex;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:4px 16px;font-size:14px;font-weight:500;color:var(--ink-2)}
.chip[aria-pressed=true]{border-color:var(--ink);background:var(--ink);color:var(--on-ink)}
.thumbs{display:flex;gap:12px;margin-top:16px;overflow-x:auto;padding-bottom:4px}
.thumbs button{flex:0 0 76px;height:76px;border-radius:var(--r);border:2px solid transparent;padding:0;overflow:hidden;background:var(--card)}
.thumbs button img{width:100%;height:100%;object-fit:cover}
.thumbs button.cut img{object-fit:contain;padding:8px}
.thumbs button[aria-pressed=true]{border-color:var(--a)}

.buy h1{font-family:var(--disp);font-weight:600;font-size:clamp(34px,4.4vw,52px);line-height:1.02;margin:8px 0 8px;letter-spacing:-.5px}
.round{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--a);background:color-mix(in srgb,var(--a) 12%,transparent);padding:4px 12px;border-radius:6px}
.round.closed{color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,transparent)}
.round i{width:8px;height:8px;border-radius:50%;background:currentColor}
.sub{color:var(--ink-2);margin:0 0 20px;max-width:46ch}
.price{display:flex;align-items:baseline;gap:12px;margin-bottom:24px}
.price b{font-family:var(--disp);font-size:40px;font-weight:600;line-height:1}
.price span{color:var(--ink-2);font-size:15px}
.field-label{display:flex;justify-content:space-between;align-items:baseline;font-weight:600;margin:0 0 8px;font-size:15px}
.field-label small{font-weight:500;color:var(--ink-2)}
.designs{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:24px}
.dcard{border:2px solid var(--line-2);background:var(--card);border-radius:var(--r);padding:8px 8px 12px;text-align:left;display:flex;flex-direction:column;gap:8px;min-height:132px}
.dcard .pic{height:80px;display:grid;place-items:center}
.dcard .pic img,.dcard .pic svg{max-height:78px;width:auto}
.dcard .nm{font-weight:600;font-size:14px;line-height:1.25}
.dcard .sw{display:flex;gap:4px}
.dcard .sw i{width:12px;height:12px;border-radius:3px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.dcard[aria-pressed=true]{border-color:var(--a);box-shadow:0 0 0 3px color-mix(in srgb,var(--a) 18%,transparent)}
.dcard.slot{border-style:dashed;border-color:var(--line);background:transparent;color:var(--steel);align-items:center;justify-content:center;text-align:center;cursor:default}
.dcard.slot b{font-family:var(--disp);font-size:28px;line-height:1;color:var(--line)}
.dcard.soon{opacity:.75}
.dcard .tag{font-size:12px;color:var(--warn);font-weight:600}
.sizes{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:8px}
.sizes button{height:48px;border-radius:var(--r-sm);border:1.5px solid var(--line);background:var(--card);font-family:var(--disp);font-weight:600;font-size:16px}
.sizes button:hover{border-color:var(--ink)}
.sizes button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.qtyrow{display:flex;gap:12px;margin:20px 0 12px}
.qty{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:var(--r);background:var(--card)}
.qty button{width:44px;height:48px;border:0;background:none;font-size:20px}
.qty output{min-width:28px;text-align:center;font-weight:600}
.qtyrow .btn{flex:1}
.err,.panel .err{color:var(--bad);font-size:14px;font-weight:500;min-height:1.2em;margin:4px 0 0}

.meter{margin-top:24px;padding:16px 20px;background:var(--card);border-radius:var(--r);border:1px solid var(--line-2)}
.meter .top{display:flex;justify-content:space-between;gap:12px;font-size:14px;margin-bottom:12px}
.meter .top b{font-family:var(--disp);font-size:22px}
.bar{position:relative;height:12px;border-radius:999px;background:var(--line-2)}
.bar>i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:var(--a);}
.bar .mk{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink)}
.bar .mk span{position:absolute;top:24px;left:50%;transform:translateX(-50%);font-size:12px;white-space:nowrap;color:var(--ink-2)}
.bar .mk.end span{left:auto;right:0;transform:none}
.meter .foot{margin-top:28px;font-size:14px;color:var(--ink-2)}

/* sections */
section.blk{padding:44px 0;border-top:1px solid var(--line)}
section.blk h2{font-family:var(--disp);font-weight:600;font-size:30px;line-height:1.1;margin:0 0 8px;letter-spacing:-.3px}
section.blk .lead{color:var(--ink-2);margin:0 0 28px;max-width:62ch}
.steps{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(5,1fr);gap:0;counter-reset:s}
.steps li{position:relative;padding:20px 16px 0 0;border-top:3px solid var(--line)}
.steps li.done{border-top-color:var(--a)}
.steps li.now{border-top-color:var(--a)}
.steps li.now::after{content:"";position:absolute;top:-8px;left:0;width:13px;height:12px;border-radius:50%;background:var(--a);box-shadow:0 0 0 5px color-mix(in srgb,var(--a) 22%,transparent)}
.steps li::before{counter-increment:s;content:counter(s);font-family:var(--disp);font-weight:600;font-size:15px;color:var(--steel);display:block}
.steps b{display:block;font-size:16px;margin:2px 0 2px}
.steps span{font-size:14px;color:var(--ink-2)}
.two{display:grid;grid-template-columns:1.3fr 1fr;gap:36px;align-items:start}
table.t{width:100%;border-collapse:collapse;font-size:15px;background:var(--card);border-radius:var(--r);overflow:hidden}
table.t th,table.t td{padding:12px 16px;text-align:left;border-bottom:1px solid var(--line-2)}
table.t th{font-weight:600;background:var(--paper-2);font-size:14px;color:var(--ink-2)}
table.t td.num,table.t th.num{text-align:right;font-variant-numeric:tabular-nums}
table.t tr.hl td{background:color-mix(in srgb,var(--a) 12%,transparent);font-weight:600}
.panel{background:var(--card);border:1px solid var(--line-2);border-radius:var(--r-lg);padding:20px}
.panel h3{margin:0 0 8px;font-size:18px}
.panel p{margin:0 0 12px;color:var(--ink-2);font-size:15px}
.helper{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.input{border:1.5px solid var(--line);background:var(--field);border-radius:var(--r-sm);padding:12px 12px;width:100%;min-width:0}
.input:focus{outline:none;border-color:var(--a);box-shadow:0 0 0 3px color-mix(in srgb,var(--a) 18%,transparent)}
.input.bad{border-color:var(--bad)}
.helper .input{width:110px}
.result{margin-top:12px;font-size:15px;min-height:1.6em}
.result b{font-family:var(--disp);font-size:22px;color:var(--a)}
.measure{display:grid;grid-template-columns:96px 1fr;gap:16px;align-items:center;margin-top:16px;font-size:14px;color:var(--ink-2)}
.specs{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.specs div{border-left:3px solid var(--a);padding:2px 0 2px 16px}
.specs b{display:block}
.specs span{font-size:14px;color:var(--ink-2)}
details.qa{border-bottom:1px solid var(--line);padding:4px 0}
details.qa summary{cursor:pointer;font-weight:600;padding:12px 0;list-style:none;display:flex;justify-content:space-between;gap:12px}
details.qa summary::after{content:"+";font-family:var(--disp);font-size:22px;line-height:1;color:var(--a)}
details.qa[open] summary::after{content:"–"}
details.qa p{margin:0 0 16px;color:var(--ink-2);max-width:70ch}
footer{padding:32px 0 52px;color:var(--steel);font-size:14px;border-top:1px solid var(--line)}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(15,17,20,.42);z-index:50;opacity:0;pointer-events:none;transition:opacity var(--t-mid) var(--ease)}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--paper-2);z-index:51;transform:translateX(102%);transition:transform var(--t-slow) var(--ease);display:flex;flex-direction:column;box-shadow:-20px 0 40px rgba(0,0,0,.12)}
.drawer.on{transform:none}
.drawer .hd{display:flex;align-items:center;justify-content:space-between;padding:20px 20px;border-bottom:1px solid var(--line)}
.drawer .hd h2{margin:0;font-family:var(--disp);font-size:22px}
.x{border:0;background:none;font-size:26px;line-height:1;width:40px;height:40px;border-radius:50%}
.x:hover{background:var(--line-2)}
.drawer .bd{flex:1;overflow:auto;padding:16px 20px}
.drawer .ft{padding:16px 20px;border-top:1px solid var(--line);background:var(--card)}
.line-item{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line-2)}
.line-item .pic{width:64px;height:64px;background:var(--card);border-radius:var(--r-sm);display:grid;place-items:center;padding:4px}
.line-item .pic img,.line-item .pic svg{max-height:56px;width:auto}
.line-item b{display:block;font-size:15px}
.line-item small{color:var(--ink-2)}
.mini-qty{display:inline-flex;align-items:center;gap:2px;margin-top:4px}
.mini-qty button{width:28px;height:28px;border-radius:6px;border:1px solid var(--line);background:var(--field)}
.mini-qty span{min-width:24px;text-align:center;font-weight:600}
.sumrow{display:flex;justify-content:space-between;font-size:15px;margin:4px 0}
.sumrow.total{font-size:18px;font-weight:600;margin-top:12px}
.empty{text-align:center;padding:52px 12px;color:var(--ink-2)}
.empty b{display:block;font-family:var(--disp);font-size:20px;color:var(--ink);margin-bottom:8px}

/* checkout */
.page{padding:32px 0 60px}
.page h1{font-family:var(--disp);font-size:36px;margin:0 0 4px;line-height:1.1}
.page .lead{color:var(--ink-2);margin:0 0 24px}
.co{display:grid;grid-template-columns:1.4fr 1fr;gap:28px;align-items:start}
.co .panel{margin-bottom:20px}
.co .panel h2{font-size:19px;margin:0 0 16px;display:flex;align-items:center;gap:12px}
.co .panel h2 i{font-style:normal;font-family:var(--disp);width:28px;height:28px;border-radius:50%;background:var(--a);color:var(--on-a);display:grid;place-items:center;font-size:15px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.f{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.f label{font-size:14px;font-weight:600}
.f label small{font-weight:400;color:var(--steel)}
.f .msg{font-size:13px;color:var(--bad);min-height:0}
.radios{display:grid;gap:12px}
.radio{display:flex;gap:12px;align-items:flex-start;border:1.5px solid var(--line);background:var(--field);border-radius:var(--r);padding:12px 16px;cursor:pointer}
.radio:has(input:checked){border-color:var(--a);box-shadow:0 0 0 3px color-mix(in srgb,var(--a) 15%,transparent)}
.radio input{margin-top:4px;accent-color:var(--a)}
.radio b{display:block}
.radio span{font-size:14px;color:var(--ink-2)}
.pay{display:grid;grid-template-columns:150px 1fr;gap:20px;align-items:center;margin-top:16px;padding:16px;background:var(--paper-2);border-radius:var(--r)}
.pay .qr{background:#fff;padding:12px;border-radius:8px}
.pay p{margin:0;font-size:14px;color:var(--ink-2)}
.pay p b{color:var(--ink);font-size:16px}
.drop{display:flex;gap:16px;align-items:center;border:2px dashed var(--line);border-radius:var(--r);padding:16px;background:var(--field);margin-top:16px}
.drop img{width:64px;height:84px;object-fit:cover;border-radius:6px}
.drop .ph{width:64px;height:84px;border-radius:6px;background:var(--paper-2);display:grid;place-items:center;color:var(--steel);font-size:26px}
.check{display:flex;gap:12px;align-items:flex-start;font-size:14px;margin:12px 0;color:var(--ink-2)}
.check input{margin-top:4px;accent-color:var(--a);width:17px;height:16px}
.summary{position:sticky;top:84px}
.note{font-size:14px;color:var(--ink-2);background:color-mix(in srgb,var(--a) 9%,var(--card));border-left:3px solid var(--a);padding:12px 12px;border-radius:0 var(--r-sm) var(--r-sm) 0;margin:12px 0}

/* done + track */
.donepage{max-width:720px;margin:0 auto;text-align:left}
.ticket{background:var(--card);border-radius:var(--r-lg);overflow:hidden;border:1px solid var(--line-2);margin:20px 0}
.ticket .tp{background:var(--a);color:var(--on-a);padding:24px 24px;position:relative;overflow:hidden}
.ticket .tp small{opacity:.85}
.ticket .tp b{display:block;font-family:var(--disp);font-size:38px;line-height:1.1;letter-spacing:1px}
.ticket .bt{padding:20px 24px}
.timeline{list-style:none;margin:8px 0 0;padding:0}
.timeline li{position:relative;padding:0 0 24px 36px}
.timeline li::before{content:"";position:absolute;left:8px;top:24px;bottom:0;width:2px;background:var(--line)}
.timeline li:last-child::before{display:none}
.timeline li .dot{position:absolute;left:0;top:4px;width:18px;height:20px;border-radius:50%;border:2px solid var(--line);background:var(--card)}
.timeline li.done .dot{background:var(--a);border-color:var(--a)}
.timeline li.done::before{background:var(--a)}

  const d = (S.view==='product' ? D(S.sel.design) : null) || S.designs.find(x=>x.status==='open'&&x.imgs) || S.designs[0];

function qrSVG(seed){
  let x=seed; const r=()=> (x=(x*1103515245+12345)%2147483648)/2147483648; const n=25; let c='';
  const finder=(ox,oy)=>`<rect x="${ox}" y="${oy}" width="7" height="7" fill="#111"/><rect x="${ox+1}" y="${oy+1}" width="5" height="5" fill="#fff"/><rect x="${ox+2}" y="${oy+2}" width="3" height="3" fill="#111"/>`;
  for(let i=0;i<n;i++)for(let j=0;j<n;j++){ if((i<8&&j<8)||(i<8&&j>16)||(i>16&&j<8)) continue; if(r()<.5) c+=`<rect x="${i}" y="${j}" width="1" height="1"/>`; }
  return `<svg viewBox="-1 -1 27 27" role="img" aria-label="QR ตัวอย่าง"><g fill="#111">${c}</g>${finder(0,0)}${finder(18,0)}${finder(0,18)}</svg>`;
}

function timelineHTML(o){
  const bad = ['rejected','cancelled'].includes(o.status);
  const idx = FLOW.indexOf(o.status);
  const est = {review:'', confirmed:`ปิดรอบ ${tdate(S.settings.close,{day:'numeric',month:'short'})}`, production:'', shipped:`ภายใน ${tdate(S.settings.ship,{day:'numeric',month:'short'})}`};
  let html = '<ol class="timeline">';
  FLOW.forEach((k,i)=>{
    const cls = bad ? (i===0?'done':'') : i<idx?'done': i===idx?'done now':'';
    html += `<li class="${cls}"><span class="dot"></span><b>${STATUS[k].t}</b><span>${i===idx&&!bad?STATUS[k].d:(i>idx?est[k]:'')}${k==='shipped'&&o.track&&i<=idx?`<br>เลขพัสดุ: <strong>${esc(o.track)}</strong>`:''}</span></li>`;
    if(bad && i===0) html += `<li class="bad now"><span class="dot"></span><b>${STATUS[o.status].t}</b><span>${STATUS[o.status].d}</span></li>`;
  });
  return html+'</ol>';
}

function aOverview(){

  const paidStatuses=['confirmed','production','shipped']; const paid=S.orders.filter(o=>paidStatuses.includes(o.status));
  const rev=paid.reduce((a,o)=>a+totalOf(o),0); const nReview=S.orders.filter(o=>o.status==='review').length;
  const max=Math.max(st.target,shirts);
  const seg={}; L.forEach(o=>seg[o.cust]=(seg[o.cust]||0)+qtyOf(o)); const segMax=Math.max(...Object.values(seg),1);
  const bySize={}; L.forEach(o=>o.items.forEach(it=>bySize[it.size]=(bySize[it.size]||0)+it.qty)); const szMax=Math.max(...Object.values(bySize),1);
  return `<h1>ภาพรวม${esc(st.round)}</h1><p class="lead">${roundOpen()?`เปิดรับสั่งจองอยู่ เหลือ ${daysLeft()} วัน (ปิด ${tdate(st.close)})`:'ปิดรับสั่งจองแล้ว พร้อมสรุปยอดส่งผลิต'}</p>
  <div class="kpis">
    <div class="kpi"><small>เสื้อที่สั่งจอง (ไม่นับที่ยกเลิก)</small><b>${shirts} ตัว</b>
      <div class="bar"><i style="width:${Math.min(100,shirts/max*100)}%"></i><span class="mk" style="left:${st.minQty/max*100}%"><span>จุดคุ้มทุน ${st.minQty}</span></span><span class="mk ${st.target/max>.85?'end':''}" style="left:${Math.min(99.5,st.target/max*100)}%"><span>เป้า ${st.target}</span></span></div></div>
    <div class="kpi"><small>รายได้ที่ยืนยันแล้ว</small><b>${rev.toLocaleString()}</b><small>บาท จาก ${paid.length} คำสั่งซื้อ</small></div>
    <div class="kpi ${nReview?'warn':''}"><small>รอตรวจสลิป</small><b>${nReview}</b><button class="link" data-act="gofilter" data-v="review">ไปตรวจ</button></div>
    <div class="kpi"><small>คำสั่งซื้อทั้งหมด</small><b>${S.orders.length}</b><small>${S.orders.filter(o=>!live(o)).length} รายการยกเลิก/มีปัญหา</small></div>
  </div>
  <div class="agrid">
    <div class="panel"><h3>ยอดตามไซซ์</h3><p>รวมทุกแบบ ใช้ดูว่าไซซ์ไหนต้องเตรียมเสื้อสำรอง</p>
      <div class="bars-h">${SIZES.map(z=>`<div><span>${z.s}</span><i style="width:${(bySize[z.s]||0)/szMax*100}%"></i><span class="v">${bySize[z.s]||0}</span></div>`).join('')}</div></div>
    <div class="panel"><h3>กลุ่มลูกค้า</h3><p>จำนวนเสื้อตามกลุ่มที่ลูกค้าเลือกตอนสั่งซื้อ</p>
      <ul class="seglist">${Object.entries(CUST).sort((a,b)=>(seg[b[0]]||0)-(seg[a[0]]||0)).map(([k,v])=>`<li><span>${v}</span><span class="v">${seg[k]||0} ตัว</span><span class="p">${Math.round((seg[k]||0)/Math.max(1,shirts)*100)}%</span></li>`).join('')}</ul></div>
  </div>
  <div class="panel" style="margin-top:20px"><h3>คำสั่งซื้อล่าสุด</h3>${ordersTable(S.orders.slice(0,6))}</div>`;

function summaryData(){
  const ok=['confirmed','production','shipped'].concat(S.admin.includeReview?['review']:[]);
  const m={}; S.designs.forEach(d=>m[d.id]={});
  S.orders.filter(o=>ok.includes(o.status)).forEach(o=>o.items.forEach(it=>{ m[it.design]=m[it.design]||{}; m[it.design][it.size]=(m[it.design][it.size]||0)+it.qty; }));
  return m;
}
function customList(){
  const ok=['confirmed','production','shipped'].concat(S.admin.includeReview?['review']:[]);
  const out=[]; S.orders.filter(o=>ok.includes(o.status)).forEach(o=>o.items.forEach(it=>{ if(isCustom(it)) out.push({...it,id:o.id}); }));
  const order=SIZES.map(z=>z.s); return out.sort((a,b)=>a.design.localeCompare(b.design)||order.indexOf(a.size)-order.indexOf(b.size));
}

  return `<h1>สรุปยอดผลิต</h1><p class="lead">ตารางนี้ส่งให้โรงงานได้เลย นับเฉพาะคำสั่งซื้อที่ชำระเงินแล้ว</p>

    <tr class="hl"><td>รวม</td>${ds.map(d=>`<td class="num">${colT(d)}</td>`).join('')}<td class="num">${all}</td></tr>

  </form>
  <div class="panel" style="max-width:720px;margin-top:20px"><h3>จุดคุ้มทุนจากแผนธุรกิจ</h3>
    <p style="margin:0">ราคาขาย ${st.price} บาท − ต้นทุนแปรผัน 385 บาท = กำไรต่อตัว ${st.price-385} บาท<br>ต้นทุนคงที่ 10,000 บาทต่อรอบ จึงต้องขายอย่างน้อย <strong style="color:var(--ink)">${st.price>385?Math.ceil(10000/(st.price-385)):'—'} ตัว</strong></p></div>`;
}

/* ---------- render + events ---------- */
function render(){
  theme();
  document.querySelectorAll('.demobar .seg button').forEach(b=>b.setAttribute('aria-pressed', b.dataset.v===S.mode));
  if(S.mode==='admin'){ $('#app').innerHTML=viewAdmin(); return; }
  const v={shop:viewHome, product:viewProduct, checkout:viewCheckout, done:viewDone, track:viewTrack}[S.view]||viewShop;
  $('#app').innerHTML=v();
}

document.addEventListener('click', e=>{
  const t=e.target.closest('[data-act]'); if(!t) return;
  const a=t.dataset.act, v=t.dataset.v;
  if(t.tagName==='INPUT'||t.tagName==='SELECT') return;
  switch(a){
    case 'mode': S.mode=v; closeDrawer(); render(); window.scrollTo({top:0}); break;
    case 'go': closeDrawer(); go(v); break;
    case 'jump': { const need = v==='size'?'product':'shop'; if(S.view!==need) go(need); } setTimeout(()=>document.getElementById(v)?.scrollIntoView({behavior:'smooth'}),30); break;
    case 'side': S.sel.view=v; render(); break;
    case 'design': { S.sel.design=v; S.sel.view='front'; S.sel.size=null; S.sel.qty=1; go('product'); break; }
    case 'theme': S.dark=!S.dark; try{localStorage.setItem('mudst-theme',S.dark?'dark':'light')}catch(_){} render(); break;
    case 'clearCustom': S.sel.cname=''; S.sel.cnum=''; render(); break;
    case 'hfilter': S.homeFilter=v; render(); break;
    case 'size': S.sel.size=v; render(); break;
    case 'qty': S.sel.qty=Math.min(10,Math.max(1,S.sel.qty+ +v)); $('.qty output').textContent=S.sel.qty; break;
    case 'add': {
      if(!S.sel.size){ $('#buyErr').textContent='เลือกไซซ์ก่อนใส่ตะกร้า'; document.querySelector('.sizes button').focus(); return; }
      const cn=(S.sel.cname||'').trim().toUpperCase(), cnum=(S.sel.cnum||'').trim();
      if(cn && !/^[A-Z0-9ก-๙ .\-]{1,12}$/.test(cn)){ $('#buyErr').textContent='ชื่อใช้ได้ไม่เกิน 12 ตัวอักษร (ไทย อังกฤษ ตัวเลข เว้นวรรค จุด ขีด)'; $('#cName').focus(); return; }
      if(cnum && !/^\d{1,2}$/.test(cnum)){ $('#buyErr').textContent='เบอร์ใช้ได้ตั้งแต่ 0 ถึง 99'; $('#cNum').focus(); return; }
      const cu = (cn||cnum)?{cname:cn,cnum}:{};
      const ex=S.cart.find(c=>c.design===S.sel.design&&c.size===S.sel.size&&(c.cname||'')===(cu.cname||'')&&(c.cnum||'')===(cu.cnum||''));
      if(ex) ex.qty+=S.sel.qty; else S.cart.push({design:S.sel.design,size:S.sel.size,qty:S.sel.qty,...cu});
      S.sel.cname=''; S.sel.cnum='';
      S.sel.qty=1; render(); openDrawer(); break; }
    case 'openCart': openDrawer(); break;
    case 'closeDrawer': closeDrawer(); break;
    case 'cq': { const it=S.cart[+t.dataset.i]; it.qty=Math.max(1,Math.min(10,it.qty+ +v)); drawer(); render(); break; }
    case 'cdel': S.cart.splice(+t.dataset.i,1); drawer(); render(); break;
    case 'checkout': closeDrawer(); go('checkout'); break;
    case 'suggest': {
      const c=parseFloat(($('#chest').value||'').replace(',','.')); const out=$('#sugg');
      if(!c||c<20||c>70){ out.innerHTML='<span style="color:var(--bad)">กรอกรอบอกเป็นนิ้ว ระหว่าง 20–70</span>'; break; }
      const z=SIZES.find(z=>z.chest>=c+2);
      out.innerHTML = z?`แนะนำไซซ์ <b>${z.s}</b> (รอบอกเสื้อ ${z.chest}") <button class="link" data-act="pickSug" data-v="${z.s}">เลือกไซซ์นี้</button>`:'รอบอกใหญ่กว่าไซซ์ที่มี ติดต่อทีมงานเพื่อสั่งไซซ์พิเศษ';
      break; }
    case 'pickSug': S.sel.size=v; render(); window.scrollTo({top:0,behavior:'smooth'}); toast('เลือกไซซ์ '+v+' แล้ว'); break;
    case 'demoSlip': S.co.slipDemo=true; S.co.slip=null; keepForm(()=>render()); break;
    case 'terms': S.mode='shop'; go('shop'); setTimeout(()=>{const q=document.querySelectorAll('details.qa')[0]; q.open=true; q.scrollIntoView({behavior:'smooth'});},40); break;
    case 'trackThis': S._tid=S.lastOrder.id; S._tph=S.lastOrder.phone.slice(-4); S.trackResult=S.lastOrder; go('track'); break;
    case 'seeAdmin': S.mode='admin'; S.admin.logged=true; S.admin.tab='orders'; S.admin.filter='review'; render(); orderModal(S.lastOrder.id); break;
    case 'demoTrack': S._tid='MJ-1001'; S._tph='5678'; S.trackResult=S.orders.find(o=>o.id==='MJ-1001'); render(); break;
    case 'login': S.admin.logged=true; render(); break;
    case 'logout': S.admin.logged=false; render(); break;
    case 'atab': S.admin.tab=v; render(); break;
    case 'gofilter': S.admin.tab='orders'; S.admin.filter=v; render(); break;
    case 'filter': S.admin.filter=v; render(); break;
    case 'openOrder': orderModal(v); break;
    case 'closeModal': $('#modal').classList.remove('on'); break;
    case 'setSt': { const o=S.orders.find(x=>x.id===t.dataset.id); o.status=v; $('#modal').classList.remove('on'); render(); toast(`${o.id}: ${STATUS[v].t}`); break; }
    case 'saveOrder': { const o=S.orders.find(x=>x.id===t.dataset.id); const ns=$('#mSt').value, tr=$('#mTrack').value.trim();
      if(ns==='shipped'&&!tr){ $('#mTrack').classList.add('bad'); $('#mTrack').focus(); toast('ใส่เลขพัสดุก่อนเปลี่ยนเป็น "จัดส่งแล้ว"'); return; }
      o.status=ns; o.track=tr; $('#modal').classList.remove('on'); render(); toast(`บันทึก ${o.id} แล้ว`); break; }
    case 'bulkProd': { let n=0; S.orders.forEach(o=>{ if(o.status==='confirmed'){o.status='production';n++;} }); render(); toast(`เปลี่ยน ${n} รายการเป็น "กำลังผลิต" แล้ว`); break; }
    case 'copySum': {
      const m=summaryData(); let txt=`MUDST Jersey ${S.settings.round} — ยอดส่งผลิต\n`;
      S.designs.forEach(d=>{ const row=SIZES.map(z=>m[d.id]?.[z.s]?`${z.s} ${m[d.id][z.s]}`:'').filter(Boolean); if(row.length) txt+=`\nแบบ${d.th}: ${row.join(', ')} (รวม ${SIZES.reduce((a,z)=>a+(m[d.id]?.[z.s]||0),0)} ตัว)`; });
      const cl=customList(); if(cl.length){ txt+=`\n\nสกรีนชื่อ/เบอร์ (${cl.reduce((a,c)=>a+c.qty,0)} ตัว ที่เหลือพิมพ์ MUDST 07):`; cl.forEach(c=>txt+=`\n- ${D(c.design)?.th} ${c.size}: ${c.cname||'MUDST'} #${c.cnum||'07'}${c.qty>1?` ×${c.qty}`:''}`); }
      $('#modalBox').innerHTML=`<h2>ข้อความส่งโรงงาน</h2><pre class="copy" id="cp">${esc(txt)}</pre><div class="actions" style="justify-content:flex-end"><button class="btn ghost" data-act="closeModal">ปิด</button><button class="btn" data-act="doCopy">คัดลอก</button></div>`;
      $('#modal').classList.add('on'); break; }
    case 'doCopy': navigator.clipboard?.writeText($('#cp').textContent).then(()=>toast('คัดลอกแล้ว'),()=>toast('คัดลอกไม่ได้ในหน้านี้ ให้เลือกข้อความแล้วคัดลอกเอง')); break;
    case 'newDesign': newDesignModal(); break;
    case 'previewShop': S.mode='shop'; go('shop'); break;
  }
});
document.addEventListener('keydown', e=>{
  if(e.key==='Escape'){ $('#modal').classList.remove('on'); closeDrawer(); }
  if(e.key==='Enter' && e.target.matches('tr[data-act=openOrder]')) orderModal(e.target.dataset.v);
});
document.addEventListener('input', e=>{
  if(e.target.id==='cName'||e.target.id==='cNum'){
    const el=e.target; if(el.id==='cNum') el.value=el.value.replace(/\D/g,''); 
    S.sel[el.id==='cName'?'cname':'cnum']=el.value; S.sel.view='back';
    const id=el.id, pos=el.selectionStart; render(); const n=$('#'+id); n.focus(); try{n.setSelectionRange(pos,pos)}catch(_){}
  }
  if(e.target.id==='aq'){ S.admin.q=e.target.value; const pos=e.target.selectionStart; render(); const n=$('#aq'); n.focus(); n.setSelectionRange(pos,pos); }
  if(['ndC1','ndC2','ndC3'].includes(e.target.id)) ndPreview();
  if(e.target.classList.contains('bad')) e.target.classList.remove('bad');
});
document.addEventListener('change', e=>{
  const t=e.target;
  if(t.name==='pay'){ S.co.pay=t.value; keepForm(()=>render()); }
  if(t.id==='fSlip' && t.files[0]){ readImg(t.files[0], url=>{ S.co.slip=url; S.co.slipDemo=false; keepForm(()=>render()); }); }
  if(t.dataset.act==='incReview'){ S.admin.includeReview=t.checked; render(); }
  if(t.dataset.act==='dstatus'){ const d=D(t.dataset.v); d.status=t.value; if(S.sel.design===d.id&&d.status==='hidden'){ S.sel.design=S.designs.find(x=>x.status!=='hidden')?.id||S.designs[0].id; } toast(`${d.th}: อัปเดตสถานะแล้ว`); }
  if(t.id==='ndF'||t.id==='ndB'){ const k=t.id==='ndF'?'front':'back'; if(t.files[0]) readImg(t.files[0], url=>S._nd[k]=url); }
});
function readImg(file, cb){ const r=new FileReader(); r.onload=()=>cb(r.result); r.readAsDataURL(file); }

/* keep typed checkout values across re-render */
const CO_FIELDS=['fName','fPhone','fEmail','fCust','fAddr','fDist','fProv','fZip','fTerms','fPdpa'];
function keepForm(fn){ const vals={}; CO_FIELDS.forEach(id=>{const el=$('#'+id); if(el) vals[id]=el.type==='checkbox'?el.checked:el.value;}); fn(); CO_FIELDS.forEach(id=>{const el=$('#'+id); if(el&&id in vals){ if(el.type==='checkbox') el.checked=vals[id]; else el.value=vals[id]; }}); }

document.addEventListener('submit', e=>{
  e.preventDefault(); const f=e.target;
  if(f.id==='coForm'){
    const req={fName:'กรอกชื่อ-นามสกุล', fPhone:'กรอกเบอร์โทร 10 หลัก ขึ้นต้นด้วย 0', fAddr:'กรอกที่อยู่สำหรับจัดส่ง', fDist:'กรอกตำบล/อำเภอ', fProv:'กรอกจังหวัด', fZip:'รหัสไปรษณีย์ 5 หลัก'};
    let first=null;
    Object.entries(req).forEach(([id,msg])=>{ const el=$('#'+id); let v=el.value.trim(); let bad=!v;
      if(id==='fPhone') bad=!/^0\d{9}$/.test(v.replace(/[\s-]/g,'')); if(id==='fZip') bad=!/^\d{5}$/.test(v);
      el.classList.toggle('bad',bad); el.nextElementSibling.textContent=bad?msg:''; if(bad&&!first) first=el; });
    const em=$('#fEmail'); const badE = em.value.trim() && !/^\S+@\S+\.\S+$/.test(em.value.trim()); em.classList.toggle('bad',!!badE); em.nextElementSibling.textContent=badE?'รูปแบบอีเมลไม่ถูกต้อง':''; if(badE&&!first) first=em;
    $('#slipErr').textContent = (S.co.slip||S.co.slipDemo)?'':'แนบสลิปการโอน หรือใช้สลิปตัวอย่างสำหรับการสาธิต';
    const terms=$('#fTerms').checked&&$('#fPdpa').checked;
    $('#coErr').textContent = first?'ยังกรอกข้อมูลไม่ครบ ดูช่องที่ขึ้นสีแดง': !(S.co.slip||S.co.slipDemo)?'ยังไม่ได้แนบสลิปการโอน': !terms?'ติ๊กยอมรับเงื่อนไขทั้งสองข้อก่อนยืนยัน':'';
    if(first){ first.focus(); return; } if(!(S.co.slip||S.co.slipDemo)||!terms) return;
    const id='MJ-'+(1001+S.orders.length);
    const o={id, name:$('#fName').value.trim(), phone:$('#fPhone').value.replace(/[\s-]/g,''), email:em.value.trim(), cust:$('#fCust').value,
      addr:$('#fAddr').value.trim()+' '+$('#fDist').value.trim(), prov:$('#fProv').value.trim(), zip:$('#fZip').value.trim(),
      items:S.cart.map(c=>({...c})), pay:S.co.pay, slip:S.co.slip, status:'review', track:'', created:new Date().toISOString()};
    S.orders.unshift(o); S.lastOrder=o; S.cart=[]; S.co={slip:null,slipDemo:false,pay:'promptpay'}; go('done');
  }
  if(f.id==='trackForm'){
    const id=$('#tId').value.trim().toUpperCase(), ph=$('#tPh').value.trim(); S._tid=id; S._tph=ph;
    const o=S.orders.find(x=>x.id===id && x.phone.slice(-4)===ph); S.trackResult=o||false; render();
  }
  if(f.id==='setForm'){
    const n=id=>parseInt($('#'+id).value,10);
    const o=$('#sOpen').value, c=$('#sClose').value, s=$('#sShip').value;
    let err=''; if(!(n('sPrice')>0)) err='ราคาต้องเป็นตัวเลขมากกว่า 0'; else if(!(o&&c&&s)) err='กรอกวันให้ครบทั้ง 3 ช่อง'; else if(c<o) err='วันปิดรับต้องอยู่หลังวันเปิดรับ'; else if(s<c) err='วันจัดส่งต้องอยู่หลังวันปิดรับ'; else if(!(n('sMin')>0&&n('sTarget')>0)) err='ยอดขั้นต่ำและเป้าหมายต้องเป็นตัวเลข';
    $('#setErr').textContent=err; if(err) return;
    Object.assign(S.settings,{round:$('#sRound').value.trim()||S.settings.round, price:n('sPrice'), customFee:Math.max(0,parseInt($('#sFee').value,10)||0), open:o, close:c, ship:s, minQty:n('sMin'), target:n('sTarget'), isOpen:$('#sIsOpen').checked});
    render(); toast('บันทึกการตั้งค่าแล้ว หน้าร้านอัปเดตแล้ว');
  }
  if(f.id==='ndForm'){
    const th=$('#ndTh').value.trim(); if(!th){ $('#ndTh').classList.add('bad'); $('#ndTh').nextElementSibling.textContent='ตั้งชื่อแบบเสื้อ'; $('#ndTh').focus(); return; }
    const c=[$('#ndC1').value,$('#ndC2').value,$('#ndC3').value];
    const lum=h=>{const n=parseInt(h.slice(1),16);return (0.299*(n>>16)+0.587*(n>>8&255)+0.114*(n&255))/255;};
    const a = lum(c[1])>0.6 ? c[0] : c[1];
    const d={id:'d'+Date.now(), th, en:$('#ndEn').value.trim(), colors:c, a, a2:c[2], on: lum(a)>0.6?'#1B1D21':'#FFFFFF',
      imgs: S._nd.front?{front:S._nd.front, back:S._nd.back||S._nd.front}:null, status:$('#ndS').value, price:parseInt($('#ndP').value,10)||S.settings.price};
    { const pi=S.designs.findIndex(x=>x.ph); if(pi>=0) S.designs.splice(pi,1,d); else S.designs.push(d); } $('#modal').classList.remove('on'); render(); toast(`เพิ่มแบบ "${th}" แล้ว`);
  }
});

/* initial route */
(function(){ const h=(location.hash||'').slice(1); if(h==='admin'){S.mode='admin';} else if(['track','product'].includes(h)) S.view=h; render(); })();
</script>
